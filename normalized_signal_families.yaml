### Family: `detector_processed`

Detector-processed stubs after initial decoding/unpacking. These carry
per-station hit information ready for concentration and region filtering.

| wiring_kind | Stage | Producers | Consumers |
|-------------|-------|-----------|-----------|
| `dt_processed_stub` | DT IF → Conc → RgF/Mem | dt_interface_ip | concentrator_ip, region_filter_ip, layermem_ip |
| `csc_processed_stub` | CSC IF → Conc → RgF/Mem | csc_interface_ip | concentrator_ip, region_filter_ip, layermem_ip |
| `rpc_stub` | RPC tieoff → Conc → delays → RgF/Mem | (rpc_tieoff) | concentrator_ip, signal_delay, region_filter_ip, layermem_ip |

