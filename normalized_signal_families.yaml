# Normalized Signal Families — Canonical Vocabulary

**Version:** 2.0
**Date:** 2026-04-06
**Status:** Complete — reflects full Topology A migration

---

## Purpose

This file defines the canonical semantic vocabulary for all signal families
that cross module boundaries. Each family groups related `wiring_kind` values
that share physical encoding and dataflow stage.

The goal is to:
1. Provide a closed vocabulary for `wiring_kind` values in interface contracts
2. Drive topology_groups matching (auto_match, role_pairs, instance_assign)
3. Make the dataflow pipeline stages explicit and auditable

---

## Signal Family Registry

### Family: `configuration`

Configuration broadcast signals distributed from cfg instances to processing IPs.

| wiring_kind | Stage | Producers | Consumers |
|-------------|-------|-----------|-----------|
| `cfg64_word` | cfg → dt/csc IFs | cfg64_from_framework | dt_interface_ip, csc_interface_ip |
| `cfg_valid_strobe` | cfg → dt/csc IFs | cfg64_from_framework | dt_interface_ip, csc_interface_ip |

