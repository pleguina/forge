## Validation Rules

1. Every `wiring_kind` value in a contract MUST appear in this registry
2. New `wiring_kind` values require a PR that updates this file
3. A `wiring_kind` value belongs to exactly one family
4. Producer and consumer columns must be kept in sync with actual contracts
5. Families map 1:1 to dataflow pipeline stages (no family spans >1 stage boundary)

---

## Usage in Topology A

In the target architecture, `topology_groups` in design.yml will reference
signal families (not individual wiring_kind values) when wiring heterogeneous
boundaries such as "all detector stubs from concentrator to region filter":

```yaml
# Future topology_groups syntax (Step 9 draft):
topology_groups:
  - name: concentrator_to_region_filter
    family: detector_processed
    producers: [concentrator]
    consumers: [region_filter]
```

The generator resolves family → wiring_kind values → individual contract roles
→ physical ports.
