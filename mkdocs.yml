site_name: FORGE
site_description: >-
  Framework for Orchestrated RTL Generation & Evaluation — a plugin-agnostic,
  contract-driven integration and verification framework for RTL/HLS firmware.
# site_url is deliberately still unset: the source repo is now decided
# (https://github.com/pleguina/forge) but whether/where the docs site
# itself gets published (e.g. GitHub Pages at
# https://pleguina.github.io/forge/) hasn't been confirmed. A URL here
# that doesn't match where the site actually lands makes MkDocs Material
# emit absolute-path links on pages like 404.html that don't resolve
# locally — a real bug this exact placeholder caused during development
# (see forge/tests/test_docs_site_links.py). Set this for real only once
# docs publishing is confirmed.
repo_url: https://github.com/pleguina/forge
repo_name: pleguina/forge
docs_dir: docs
site_dir: site
strict: true

# docs/plan/** is an internal release-planning/audit workspace (raw,
# first-person, still-evolving, gitignored) and docs/internal/** is
# reserved for any tracked-in-git material that still isn't public-site
# content — neither is fit for the public site. Nav omission alone does
# not stop MkDocs from rendering a file, so both are physically excluded
# from the build here.
exclude_docs: |
  plan/**
  internal/**

theme:
  name: material
  font: false
  logo: assets/images/forge-logo.png
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - toc.follow

# No analytics/social-card plugins, no CDN fonts (font: false above) — the
# built site must load fully offline. See forge/tests/test_docs_site_offline.py.
plugins:
  - search

# Local-only stylesheet (docs/assets/stylesheets/forge.css) — no CDN, no
# external fonts, checked by forge/tests/test_docs_site_offline.py.
extra_css:
  - assets/stylesheets/forge.css

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

