part: xczu7ev-ffvc1156-2-e
clock_period: 5.0
max_parallel_jobs: 1

block_protocol: none
connect_clock: true
connect_reset: true

interface_metadata:
  clock_reset_ports: [ap_clk, ap_rst]
  input_groups:
    data_inputs:
      match: ['^ingress_in_data$']
      stimulus_prefix: DATA_IN
  output_groups:
    data_outputs:
      match: ['^egress_out_data$']

modules:
  - name: ingress
    top: rtl_passthrough
    src: [rtl/rtl_passthrough.v]
    includes: []
    stages: []
    kind: rtl
    rtl_lang: verilog
    instances: 1
    external_in_ports: [in_data]
    external_out_ports: []

  - name: egress
    top: rtl_passthrough
    src: [rtl/rtl_passthrough.v]
    includes: []
    stages: []
    kind: rtl
    rtl_lang: verilog
    instances: 1
    external_in_ports: []
    external_out_ports: [out_data]

connections:
  - from: ingress
    to: egress
    port_map:
      - [out_data, in_data]