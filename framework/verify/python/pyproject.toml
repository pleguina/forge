[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-verify"
version = "1.0.0"
description = "HDL verification framework — tb generation, preflight, simulation dispatch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "OMTF Framework Team", email = "omtf-framework@cern.ch"},
]
keywords = ["hdl", "verilog", "fpga", "simulation", "testbench", "xsim", "csim", "hls"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Structured Verilog parser — enables Mode A in fw_verify.rtl_introspection.
# Falls back to HLS-regex mode when absent.
parser = ["pyverilog>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
fw_verify = "fw_verify.__main__:main"

[project.urls]
Homepage = "https://gitlab.cern.ch/pleguina/omtf_v2"
Repository = "https://gitlab.cern.ch/pleguina/omtf_v2"

[tool.setuptools]
packages = ["fw_verify"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
fw_verify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../../plugins"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
