# ═══════════════════════════════════════════════════════════════════════════
# Trigger Demo — Result Plot Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Defines the figures generated by:
#   arc analyze plot-results \
#     --config plugins/trigger_demo/verify/plot_config.yml \
#     --observed out/reports/observed_pipeline.csv \
#     --reference out/reports/reference_pipeline.csv \
#     --output out/plots
# ═══════════════════════════════════════════════════════════════════════════

plots:

  # ── Time-domain: out_valid pulse train ─────────────────────────────────
  - name: out_valid_timeline
    kind: line
    x: cycle
    y: tout_out_valid
    title: "Output Valid Timeline — Full Pipeline (trigger_pipeline_xsim)"
    xlabel: "Clock Cycle (@ 250 MHz)"
    ylabel: "tout_out_valid"
    figsize: [14, 4]

  # ── Trigger quality per event ──────────────────────────────────────────
  - name: trigger_quality
    kind: scatter
    x: cycle
    y: trigger_quality
    title: "Trigger Quality per Output Event (observed vs reference)"
    xlabel: "Output Cycle"
    ylabel: "trigger_quality (n_hits)"
    figsize: [10, 6]

  # ── Trigger accept per event ──────────────────────────────────────────
  - name: trigger_accept
    kind: scatter
    x: cycle
    y: trigger_accept
    title: "Trigger Accept per Output Event (observed vs reference)"
    xlabel: "Output Cycle"
    ylabel: "trigger_accept"
    figsize: [10, 5]

  # ── Full trigger word comparison ──────────────────────────────────────
  - name: trigger_word
    kind: bar
    x: cycle
    y: tout_trigger_word
    title: "Packed Trigger Word per Output Event"
    xlabel: "Output Cycle"
    ylabel: "trigger_word (decimal)"
    figsize: [10, 6]
