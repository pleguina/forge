# Integration contract for the trigger_contract_sink RTL helper

ip_interface:
  module_name: trigger_contract_sink
  source_type: rtl
  normalization_status: ready
  notes: >
    Consumes the 2-lane trigger metadata arrays via contract_wiring and
    reconstructs scalar trigger fields for the final output packer.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    accept_lane_array:
      array: true
      raw_port_prefix: accept_lane_
      count: 2
      direction: input
      width: 1
      wiring_kind: trigger_accept_lane

    quality_lane_array:
      array: true
      raw_port_prefix: quality_lane_
      count: 2
      direction: input
      width: 8
      wiring_kind: trigger_quality_lane

    valid_lane_array:
      array: true
      raw_port_prefix: valid_lane_
      count: 2
      direction: input
      width: 1
      wiring_kind: trigger_valid_lane

    trigger_accept:

    trigger_quality:

    trigger_valid:
