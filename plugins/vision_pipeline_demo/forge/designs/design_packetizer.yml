# ═══════════════════════════════════════════════════════════════════════════
# Vision Pipeline Demo — Design Topology (packetizer path)
# ═══════════════════════════════════════════════════════════════════════════
#
# Pipeline:
#
#   external pixel stream -> norm_px (pixel_normalizer, HLS)
#     -> window_builder_rtl -> sobel_hls  ─┐
#     -> threshold_rtl, +12-cycle delay     ┴-> edge_mask_merge_rtl
#     -> pixel_result_packer_rtl (128-bit pixel-result record + toggle)
#     ─┐
#      │ [async FIFO: ap_clk (pixel) -> clk_output (output), depth 64]
#      ┴-> packetizer_rtl (output domain) ─┐
#     ┌────────────────────────────────────┘
#     │ [async FIFO: ap_clk (pixel) -> clk_output (output), depth 64]
#   external pixel stream -> norm_tile (pixel_normalizer, HLS)
#     -> tile_stats_hls -> tile_boundary_rtl -> tile_summary_join_rtl
#     -> tile_stats_packer_rtl (128-bit tile-statistics record + toggle)
#     ─┘
#   packetizer_rtl -> external forge.packet_stream.v1 (256-bit beat)
#
# Two clock domains: `pixel` is this design's *primary* domain (literal
# ap_clk/ap_rst, same convention design_pixel_result.yml/
# design_tile_stats.yml already use for every module reused unmodified
# below) at a real 200MHz/5ns rate -- unlike some earlier designs' own
# informal 4.0ns testing clock, this design cares about real domain rates
# for throughput reporting. `output` is a real secondary domain
# (clk_output/rst_output, 125MHz/8ns), with a real
# reset_domains.rst_output.sync: reset_sync destination synchronized from
# the same external ap_rst -- same convention design_cdc.yml already
# established.
#
# Reused unmodified from design_pixel_result.yml and design_tile_stats.yml:
# winbld/sobel/thresh/merge and tstats/tbnd/tjoin respectively, each behind
# its own `norm` instance (norm_px / norm_tile) -- two independent
# normalizer instances, not one shared fan-out source. Kept as two
# independent instances deliberately, not as an oversight: unifying them
# into a single shared-source fan-out is real topology work, done
# separately in design_full_functional.yml. This design's own job is the
# packetizer/async-FIFO/throughput capability set, demonstrated standalone
# -- not that unification.
#
# The design principle realized literally here -- "two independent output
# paths, multiplexed AT THE PACKETIZER, not merged before it" -- means
# pixel_result_packer_rtl and tile_stats_packer_rtl each source their
# *own* async_fifo crossing directly into packetizer_rtl; there is no
# shared arbiter/FIFO upstream of it. See packetizer_rtl.v's header for
# how it detects real novelty on each crossing (a toggle bit embedded in
# the crossed payload, since FORGE's structural port_map wiring routes no
# `empty`/valid signal to the destination side of an async_fifo
# connection) without any core-framework change, and
# docs/development/adr/0002-cdc-primitive-semantics.md for why that
# convention exists project-wide.
# ═══════════════════════════════════════════════════════════════════════════

schema_version: "1.0"
part: xcvu9p-flga2104-2L-e
clock_period: 5.0   # pixel domain (ap_clk): 200MHz

block_protocol: none
connect_clock: true
connect_reset: true

registry: ../modules.yml

reset_domains:
  rst_output:
    derived_from: ap_rst
    sync: reset_sync

# Tier 2 probes: real occupancy/backpressure telemetry from both async_fifo
# crossings, generated but not routed to any module port (see
# packetizer_rtl's own header for why functional correctness doesn't
# depend on these) -- bound here via forge.verification.gen_sim's Tier 2 probe
# mechanism directly to algo_top's internal `sync_net_*` wires (hierarchical
# `dut.<net>` references, real net names confirmed against a real
# `forge topgen gen-top` run of this exact design), for
# forge.analysis.throughput_runtime.probe.build_runtime_throughput_result
# to consume from the resulting wide-format probe CSV
# (forge.throughput_result.v1).
interface_metadata:
  tier2_probes:
    - {name: pr_full,        net: "dut.sync_net_prpack_pktz_out_record_full",        width: 1}
    - {name: pr_empty,       net: "dut.sync_net_prpack_pktz_out_record_empty",       width: 1}
    - {name: pr_overflow,    net: "dut.sync_net_prpack_pktz_out_record_overflow",    width: 1}
    - {name: pr_underflow,   net: "dut.sync_net_prpack_pktz_out_record_underflow",   width: 1}
    - {name: pr_occupancy,   net: "dut.sync_net_prpack_pktz_out_record_occupancy",   width: 7}
    - {name: pr_high_water,  net: "dut.sync_net_prpack_pktz_out_record_high_water",  width: 7}
    - {name: ts_full,        net: "dut.sync_net_tspack_pktz_out_record_full",        width: 1}
    - {name: ts_empty,       net: "dut.sync_net_tspack_pktz_out_record_empty",       width: 1}
    - {name: ts_overflow,    net: "dut.sync_net_tspack_pktz_out_record_overflow",    width: 1}
    - {name: ts_underflow,   net: "dut.sync_net_tspack_pktz_out_record_underflow",   width: 1}
    - {name: ts_occupancy,   net: "dut.sync_net_tspack_pktz_out_record_occupancy",   width: 7}
    - {name: ts_high_water,  net: "dut.sync_net_tspack_pktz_out_record_high_water",  width: 7}

modules:

# ── Pixel-result path (reused unmodified) ───────────────────────────────
- name: norm_px
  ref: pixel_normalizer
  instances: 1
  external_in_ports: [pixel, x, y, frame_id, tile_id, end_of_line, end_of_frame, pixel_valid]

- name: winbld
  ref: window_builder_rtl
  instances: 1

- name: sobel
  ref: sobel_hls
  instances: 1

- name: thresh
  ref: threshold_rtl
  instances: 1

- name: merge
  ref: edge_mask_merge_rtl
  instances: 1

- name: prpack
  ref: pixel_result_packer_rtl
  instances: 1

# ── Tile-statistics path (reused unmodified) ───────────────────────────
- name: norm_tile
  ref: pixel_normalizer
  instances: 1
  external_in_ports: [pixel, x, y, frame_id, tile_id, end_of_line, end_of_frame, pixel_valid]

- name: tstats
  ref: tile_stats_hls
  instances: 1

- name: tbnd
  ref: tile_boundary_rtl
  instances: 1

- name: tjoin
  ref: tile_summary_join_rtl
  instances: 1

- name: tspack
  ref: tile_stats_packer_rtl
  instances: 1

# ── Packetizer (output domain) ──────────────────────────────────────────────
- name: pktz
  ref: packetizer_rtl
  instances: 1
  external_out_ports: [packet_data, packet_keep, packet_last, packet_valid]

connections:

# Pixel-result path.
- from: norm_px
  to: winbld
  port_map:
    - [normalized_pixel, normalized_pixel]
    - [x_out, x]
    - [y_out, y]
    - [frame_id_out, frame_id]
    - [tile_id_out, tile_id]
    - [end_of_line_out, end_of_line]
    - [end_of_frame_out, end_of_frame]
    - [normalized_valid, in_valid]

- from: norm_px
  to: thresh
  port_map:
    - [normalized_pixel, normalized_pixel]
    - [x_out, x]
    - [y_out, y]
    - [frame_id_out, frame_id]
    - [tile_id_out, tile_id]
    - [end_of_line_out, end_of_line]
    - [end_of_frame_out, end_of_frame]
    - [normalized_valid, in_valid]

- from: winbld
  to: sobel
  port_map:
    - [win_r0c0, win_r0c0]
    - [win_r0c1, win_r0c1]
    - [win_r0c2, win_r0c2]
    - [win_r1c0, win_r1c0]
    - [win_r1c1, win_r1c1]
    - [win_r1c2, win_r1c2]
    - [win_r2c0, win_r2c0]
    - [win_r2c1, win_r2c1]
    - [win_r2c2, win_r2c2]
    - [out_x, x]
    - [out_y, y]
    - [out_frame_id, frame_id]
    - [out_tile_id, tile_id]
    - [out_end_of_line, end_of_line]
    - [out_end_of_frame, end_of_frame]
    - [out_valid, in_valid]

- from: sobel
  to: merge
  port_map:
    - [gradient_magnitude, sobel_magnitude]
    - [x_out, sobel_x]
    - [y_out, sobel_y]
    - [frame_id_out, sobel_frame_id]
    - [tile_id_out, sobel_tile_id]
    - [end_of_line_out, sobel_end_of_line]
    - [end_of_frame_out, sobel_end_of_frame]
    - [out_valid, sobel_valid]

- from: thresh
  to: merge
  delay_cycles: 12
  port_map:
    - [out_pixel, thresh_pixel]
    - [threshold_mask, thresh_mask]
    - [out_x, thresh_x]
    - [out_y, thresh_y]
    - [out_frame_id, thresh_frame_id]
    - [out_tile_id, thresh_tile_id]
    - [out_end_of_line, thresh_end_of_line]
    - [out_end_of_frame, thresh_end_of_frame]
    - [out_valid, thresh_valid]

- from: merge
  to: prpack
  port_map:
    - [normalized_pixel, in_normalized_pixel]
    - [gradient_magnitude, in_gradient_magnitude]
    - [threshold_mask, in_threshold_mask]
    - [out_x, in_x]
    - [out_y, in_y]
    - [out_frame_id, in_frame_id]
    - [out_tile_id, in_tile_id]
    - [out_end_of_line, in_end_of_line]
    - [out_end_of_frame, in_end_of_frame]
    - [out_valid, in_valid]

# Tile-statistics path.
- from: norm_tile
  to: tstats
  port_map:
    - [normalized_pixel, normalized_pixel]
    - [x_out, x]
    - [y_out, y]
    - [frame_id_out, frame_id]
    - [tile_id_out, tile_id]
    - [end_of_line_out, end_of_line]
    - [end_of_frame_out, end_of_frame]
    - [normalized_valid, in_valid]

- from: norm_tile
  to: tbnd
  port_map:
    - [x_out, x]
    - [y_out, y]
    - [frame_id_out, frame_id]
    - [tile_id_out, tile_id]
    - [end_of_line_out, end_of_line]
    - [end_of_frame_out, end_of_frame]
    - [normalized_valid, in_valid]

- from: tstats
  to: tjoin
  port_map:
    - [minimum, stats_minimum]
    - [maximum, stats_maximum]
    - [mean, stats_mean]
    - [variance, stats_variance]
    - [tile_id_out, stats_tile_id]
    - [frame_id_out, stats_frame_id]
    - [out_valid, stats_valid]

- from: tbnd
  to: tjoin
  port_map:
    - [tag_valid, tag_valid]
    - [tag_tile_id, tag_tile_id]
    - [tag_frame_id, tag_frame_id]
    - [tag_end_of_frame, tag_end_of_frame]

- from: tjoin
  to: tspack
  port_map:
    - [out_tile_id, in_tile_id]
    - [out_minimum, in_minimum]
    - [out_maximum, in_maximum]
    - [out_mean, in_mean]
    - [out_variance, in_variance]
    - [out_frame_id, in_frame_id]
    - [out_valid, in_valid]

# Packetizer crossings (pixel -> output), each its own async FIFO, each
# with a real per-record write_enable_pin -- otherwise cdc_async_fifo
# writes a fresh entry every ap_clk cycle regardless of novelty, flooding
# the FIFO and making occupancy/high-water telemetry meaningless (see
# cdc_async_fifo.v's own header for the real gap this closes).
- from: prpack
  to: pktz
  cdc:
    kind: async_fifo
    depth: 64
    write_enable_pin: out_record_valid
  port_map:
    - [out_record, pr_record_in]

- from: tspack
  to: pktz
  cdc:
    kind: async_fifo
    depth: 64
    write_enable_pin: out_record_valid
  port_map:
    - [out_record, ts_record_in]
