# ═══════════════════════════════════════════════════════════════════════════
# Vision Pipeline Demo — Module Registry (quickstart tier)
# ═══════════════════════════════════════════════════════════════════════════
#
# Release-plan Phase 10, slice 10.1 — the first, smallest rung of the
# vision_pipeline_demo ladder (docs/internal/phase10/preflight.md /
# vision_pipeline_reference_project.md). One HLS module, one RTL module:
#
#   pixel_normalizer (HLS) -> threshold_rtl (RTL) -> external result stream
#
# The fuller design (Sobel, tile statistics, CDC, throughput) is later
# slices (10.2-10.7); this registers only what the quickstart tier needs.
# ═══════════════════════════════════════════════════════════════════════════
registry_version: '1'

defaults:
  part: xcvu9p-flga2104-2L-e
  clock_period: 4.0
  vendor: vision_pipeline_demo
  version: '1.0'

modules:

# ─── Pixel Normalizer (HLS) ────────────────────────────────────────────────
- name: pixel_normalizer
  kind: hls
  top: pixel_normalizer
  # HLS LATENCY min=3 max=3 — a real fixed latency, not a rough estimate
  # (same structured latency: {kind: fixed, ...} spelling
  # plugins/trigger_demo/forge/modules.yml's trigger_logic entry uses).
  latency:
    kind: fixed
    cycles: 3
  interface_contract: interfaces/pixel_normalizer_ip.interface.yaml
  src: [../algo/normalizer/pixel_normalizer.cpp]
  includes: [../algo/normalizer, verify/include, verify/src]

  build:
    stages: [csim, synth, cosim, export]
    csim_opts: -clean

  verify:
    tb_src:
      - ../algo/normalizer/pixel_normalizer.cpp
      - verify/src/logging.cpp
      - verify/tests/tb_pixel_normalizer.cpp
    tb_args: verify/schemas/data/vision_pipeline_quickstart_golden.xml
    testbench_target: tb_pixel_normalizer

# ─── Threshold Comparator (RTL) ────────────────────────────────────────────
- name: threshold_rtl
  kind: rtl
  rtl_lang: verilog
  top: threshold_rtl
  # Fixed 2-cycle registered latency (see algo/rtl/threshold_rtl.v).
  latency:
    kind: fixed
    cycles: 2
  interface_contract: interfaces/threshold_rtl.interface.yaml
  src: [../algo/rtl/threshold_rtl.v]

# ─── Window Builder (RTL) — slice 10.2 ─────────────────────────────────────
- name: window_builder_rtl
  kind: rtl
  rtl_lang: verilog
  top: window_builder_rtl
  # Fixed FRAME_WIDTH+2 cycle latency (FRAME_WIDTH=8 here) -- empirically
  # verified, not just derived; see algo/rtl/window_builder_rtl.v's header.
  latency:
    kind: fixed
    cycles: 10
  interface_contract: interfaces/window_builder_rtl.interface.yaml
  src: [../algo/rtl/window_builder_rtl.v]

# ─── Sobel Gradient (HLS) — slice 10.2 ─────────────────────────────────────
- name: sobel_hls
  kind: hls
  top: sobel_hls
  # Fixed 4-cycle latency (see algo/sobel/sobel_hls.cpp's LATENCY pragma).
  latency:
    kind: fixed
    cycles: 4
  interface_contract: interfaces/sobel_hls.interface.yaml
  src: [../algo/sobel/sobel_hls.cpp]
  includes: [../algo/sobel]

  build:
    stages: [csim, synth, cosim, export]
    csim_opts: -clean

# ─── Edge/Mask Merge (RTL) — slice 10.2 ────────────────────────────────────
- name: edge_mask_merge_rtl
  kind: rtl
  rtl_lang: verilog
  top: edge_mask_merge_rtl
  # Fixed 1-cycle latency (see algo/rtl/edge_mask_merge_rtl.v).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/edge_mask_merge_rtl.interface.yaml
  src: [../algo/rtl/edge_mask_merge_rtl.v]

# ─── Tile Statistics (HLS) — slice 10.3 ────────────────────────────────────
- name: tile_stats_hls
  kind: hls
  top: tile_stats_hls
  # Fixed 6-cycle latency, II=2. The spec's own text (§11/§15.2) frames
  # this module as "bounded 6..10 cycles" -- first attempted here as a
  # real `#pragma HLS LATENCY min=6 max=6` -- max=10 -- constraint (see
  # algo/tile_stats/tile_stats_hls.cpp), but the real Vitis HLS csynth
  # report came back min==max==6: a plain PIPELINE II=2 function with no
  # genuinely variable-length execution path schedules to one fixed
  # depth, not a real per-invocation range. Corrected to `kind: fixed`
  # here to match the real synthesis report (release-plan Phase 10,
  # slice 10.3 -- same "verified, not assumed" discipline 10.2's
  # window_builder_rtl/threshold_rtl figures were checked against).
  # tile_boundary_rtl/tile_summary_join_rtl's own bounded/elastic
  # declarations below are unaffected -- forge.analyze.latency_static's
  # check_merge_points still classifies their shared merge point
  # `bounded_skew` (tile_boundary_rtl alone still declares `kind:
  # bounded`) and confirms zero mismatch against this real figure (see
  # `forge analyze latency-check` output cited in preflight.md's 10.3
  # completion evidence).
  latency:
    kind: fixed
    cycles: 6
  interface_contract: interfaces/tile_stats_hls.interface.yaml
  src: [../algo/tile_stats/tile_stats_hls.cpp]
  includes: [../algo/tile_stats]

  build:
    stages: [csim, synth, cosim, export]
    csim_opts: -clean

# ─── Tile Boundary / tile-end summary (RTL) — slice 10.3 ───────────────────
- name: tile_boundary_rtl
  kind: rtl
  rtl_lang: verilog
  top: tile_boundary_rtl
  # Bounded (see algo/rtl/tile_boundary_rtl.v): the tag latches 1 cycle
  # after the triggering tile-last sample and stays valid for
  # HOLD_CYCLES=16 cycles after that -- min_cycles=1/max_cycles=17
  # declares the real window the held tag is guaranteed available in,
  # which comfortably covers tile_stats_hls's own declared [6,10]
  # bound (both branches are triggered by the same input cycle).
  latency:
    kind: bounded
    min_cycles: 1
    max_cycles: 17
  interface_contract: interfaces/tile_boundary_rtl.interface.yaml
  src: [../algo/rtl/tile_boundary_rtl.v]

# ─── Tile Summary Join (RTL) — slice 10.3 ──────────────────────────────────
- name: tile_summary_join_rtl
  kind: rtl
  rtl_lang: verilog
  top: tile_summary_join_rtl
  # Elastic (spec §15.3: "must not be reported as fixed") -- the join's
  # real completion time is dominated by whichever of its two
  # predecessors (one fixed, one bounded) is slower for a given tile,
  # not this module's own 1-cycle match-and-forward step.
  latency:
    kind: elastic
  interface_contract: interfaces/tile_summary_join_rtl.interface.yaml
  src: [../algo/rtl/tile_summary_join_rtl.v]

# ─── Control Level (RTL) — slice 10.4 ──────────────────────────────────────
- name: ctrl_level_rtl
  kind: rtl
  rtl_lang: verilog
  top: ctrl_level_rtl
  # Fixed 1-cycle latency (see algo/rtl/ctrl_level_rtl.v). A dedicated
  # module per crossing kind, not one bigger control-domain register
  # bank -- see that file's header for why (ATG027, forge.topgen.config).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/ctrl_level_rtl.interface.yaml
  src: [../algo/rtl/ctrl_level_rtl.v]

# ─── Control Pulse (RTL) — slice 10.4 ──────────────────────────────────────
- name: ctrl_pulse_rtl
  kind: rtl
  rtl_lang: verilog
  top: ctrl_pulse_rtl
  # Fixed 1-cycle latency (see algo/rtl/ctrl_pulse_rtl.v).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/ctrl_pulse_rtl.interface.yaml
  src: [../algo/rtl/ctrl_pulse_rtl.v]

# ─── Control Mailbox (RTL) — slice 10.4 ────────────────────────────────────
- name: ctrl_mailbox_rtl
  kind: rtl
  rtl_lang: verilog
  top: ctrl_mailbox_rtl
  # Fixed 1-cycle latency (see algo/rtl/ctrl_mailbox_rtl.v).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/ctrl_mailbox_rtl.interface.yaml
  src: [../algo/rtl/ctrl_mailbox_rtl.v]

# ─── Pixel Sink (RTL) — slice 10.4 ──────────────────────────────────────────
- name: pixel_sink_rtl
  kind: rtl
  rtl_lang: verilog
  top: pixel_sink_rtl
  # Fixed 1-cycle latency (see algo/rtl/pixel_sink_rtl.v). Receives from
  # three distinct source instances (ctrl_level_rtl/ctrl_pulse_rtl/
  # ctrl_mailbox_rtl) -- no cdc_map collision risk on the destination
  # side (only same-(src,dst)-pair collisions are a hazard, see
  # ctrl_level_rtl.v), so this stays one module.
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/pixel_sink_rtl.interface.yaml
  src: [../algo/rtl/pixel_sink_rtl.v]

# ─── Output Level (RTL) — slice 10.4 ───────────────────────────────────────
- name: outsink_level_rtl
  kind: rtl
  rtl_lang: verilog
  top: outsink_level_rtl
  # Fixed 1-cycle latency (see algo/rtl/outsink_level_rtl.v).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/outsink_level_rtl.interface.yaml
  src: [../algo/rtl/outsink_level_rtl.v]

# ─── Output Pulse (RTL) — slice 10.4 ───────────────────────────────────────
- name: outsink_pulse_rtl
  kind: rtl
  rtl_lang: verilog
  top: outsink_pulse_rtl
  # Fixed 1-cycle latency (see algo/rtl/outsink_pulse_rtl.v).
  latency:
    kind: fixed
    cycles: 1
  interface_contract: interfaces/outsink_pulse_rtl.interface.yaml
  src: [../algo/rtl/outsink_pulse_rtl.v]
