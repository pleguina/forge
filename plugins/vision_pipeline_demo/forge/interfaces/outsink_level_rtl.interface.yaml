# Integration contract for the outsink_level_rtl module
#
# IP: outsink_level_rtl
# ip_info_key: outlvl
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: outsink_level_rtl
  ip_info_key: outlvl
  source_type: rtl
  normalization_status: ready
  notes: >
    This is the `output` domain's async_fifo consumer and level_sync source.
    Genuinely non-standard clock_primary/reset_primary names
    (clk_output/rst_output) -- see outsink_level_rtl.v.

  roles:

    clock_primary:
      raw_port: clk_output

    reset_primary:
      raw_port: rst_output

    result_in:
      notes: "Already synchronized -- destination of the pixel -> output cdc: {kind: async_fifo} connection"

    error_in:
      notes: "Testbench-driven"

    result_status:

    error_out:
      notes: "cdc: {kind: level_sync} source -> control"
