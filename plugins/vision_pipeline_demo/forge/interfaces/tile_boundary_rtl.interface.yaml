# Integration contract for the tile_boundary_rtl module
#
# IP: tile_boundary_rtl
# ip_info_key: tbnd
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: tile_boundary_rtl
  ip_info_key: tbnd
  source_type: rtl
  normalization_status: ready
  notes: >
    This is the "tile-end summary" half of the per-tile path's tagged
    elastic join. A fan-out sibling of tile_stats_hls (both driven
    directly from pixel_normalizer), it independently re-derives the
    tile-end event and holds {tile_id, frame_id, end_of_frame} for
    HOLD_CYCLES cycles (bounded, no ack handshake) -- see
    tile_boundary_rtl.v for the full
    reasoning on why this is a real, independent re-derivation rather
    than a tap off tile_stats_hls's own output.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    x:

    y:

    frame_id:

    tile_id:

    end_of_line:

    end_of_frame:

    in_valid:
      notes: "Input valid strobe (driven from pixel_normalizer's normalized_valid)"

    tag_valid:
      notes: "Held for HOLD_CYCLES cycles after latching -- the bounded side of the join (no ack handshake, see tile_boundary_rtl.v)"

    tag_tile_id:

    tag_frame_id:

    tag_end_of_frame:
