# Integration contract for the edge_mask_merge_rtl module
#
# IP: edge_mask_merge_rtl
# ip_info_key: merge
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: edge_mask_merge_rtl
  ip_info_key: merge
  source_type: rtl
  normalization_status: ready
  notes: >
    Merges the Sobel branch (window_builder_rtl -> sobel_hls) and the
    delayed threshold branch into one forge.edge_mask_stream.v1 record.
    Real runtime tag_mismatch diagnostic, not decoration -- see
    algo/rtl/edge_mask_merge_rtl.v. Fixed latency 1 cycle, II=1.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    thresh_pixel:

    thresh_mask:

    thresh_x:

    thresh_y:

    thresh_frame_id:

    thresh_tile_id:

    thresh_end_of_line:

    thresh_end_of_frame:

    thresh_valid:

    sobel_magnitude:

    sobel_x:

    sobel_y:

    sobel_frame_id:

    sobel_tile_id:

    sobel_end_of_line:

    sobel_end_of_frame:

    sobel_valid:

    normalized_pixel:
      notes: "thresh_pixel, passed through"

    gradient_magnitude:
      notes: "sobel_magnitude, passed through"

    threshold_mask:
      notes: "thresh_mask, passed through"

    out_x:

    out_y:

    out_frame_id:

    out_tile_id:

    out_end_of_line:

    out_end_of_frame:

    out_valid:
      notes: "Asserted only when both branches are valid AND their tags match"

    tag_mismatch:
      notes: "Asserted when both branches are valid but their x/y/frame_id/tile_id/end_of_line/end_of_frame tags disagree -- a real alignment-bug diagnostic, not decoration"
