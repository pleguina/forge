# Integration contract for the tile_summary_join_rtl module
#
# IP: tile_summary_join_rtl
# ip_info_key: tjoin
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: tile_summary_join_rtl
  ip_info_key: tjoin
  source_type: rtl
  normalization_status: ready
  notes: >
    This is the "tagged elastic join" combining tile_stats_hls's
    computed statistics with tile_boundary_rtl's independently-derived
    tile-end tag into one forge.tile_statistics.v1-shaped record per
    tile. Matches by tile_id/frame_id, not cycle position, because
    tile_stats_hls's own latency is bounded rather than fixed, so the
    two branches cannot be assumed to arrive a constant number of
    cycles apart -- see tile_summary_join_rtl.v for the full reasoning.

  roles:

    clock_primary:
      raw_port: ap_clk
      direction: input
      width: 1

    reset_primary:
      raw_port: ap_rst
      direction: input
      width: 1
      active_level: high

    stats_minimum:
      raw_port: stats_minimum
      direction: input
      width: 8

    stats_maximum:
      raw_port: stats_maximum
      direction: input
      width: 8

    stats_mean:
      raw_port: stats_mean
      direction: input
      width: 16

    stats_variance:
      raw_port: stats_variance
      direction: input
      width: 24

    stats_tile_id:
      raw_port: stats_tile_id
      direction: input
      width: 16

    stats_frame_id:
      raw_port: stats_frame_id
      direction: input
      width: 16

    stats_valid:
      raw_port: stats_valid
      direction: input
      width: 1
      notes: "Driven from tile_stats_hls's out_valid"

    tag_valid:
      raw_port: tag_valid
      direction: input
      width: 1
      notes: "Driven from tile_boundary_rtl's tag_valid"

    tag_tile_id:
      raw_port: tag_tile_id
      direction: input
      width: 16

    tag_frame_id:
      raw_port: tag_frame_id
      direction: input
      width: 16

    tag_end_of_frame:
      raw_port: tag_end_of_frame
      direction: input
      width: 1

    out_tile_id:
      raw_port: out_tile_id
      direction: output
      width: 16

    out_frame_id:
      raw_port: out_frame_id
      direction: output
      width: 16

    out_minimum:
      raw_port: out_minimum
      direction: output
      width: 8

    out_maximum:
      raw_port: out_maximum
      direction: output
      width: 8

    out_mean:
      raw_port: out_mean
      direction: output
      width: 16

    out_variance:
      raw_port: out_variance
      direction: output
      width: 24

    out_end_of_frame:
      raw_port: out_end_of_frame
      direction: output
      width: 1

    out_valid:
      raw_port: out_valid
      direction: output
      width: 1

    join_mismatch:
      raw_port: join_mismatch
      direction: output
      width: 1
      notes: "Real diagnostic: stats_valid asserted with no matching pending tag (tile_id/frame_id mismatch or missing) -- edge_mask_merge_rtl's tag_mismatch precedent, adapted to bounded/elastic alignment"
