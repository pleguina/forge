# Integration contract for the window_builder_rtl module
#
# IP: window_builder_rtl
# ip_info_key: winbld
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: window_builder_rtl
  ip_info_key: winbld
  source_type: rtl
  normalization_status: ready
  notes: >
    This is a real 3x3 sliding-window generator between pixel_normalizer
    and sobel_hls. Owns the N-dimensional (raw_port_tpl, dims:[3,3])
    physical binding. Zero-padding border policy. Fixed latency
    FRAME_WIDTH+2 cycles (9 for this design's FRAME_WIDTH=8) -- see
    algo/rtl/window_builder_rtl.v for the full derivation, empirically
    verified against an independent numpy zero-pad reference model.
    Requires at least FRAME_WIDTH+2 idle cycles between frames
    (video-blanking-style gap) -- real backpressure is handled
    downstream by the packetizer/async-FIFO stage, not this module.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    normalized_pixel:

    x:

    y:

    frame_id:

    tile_id:

    end_of_line:

    end_of_frame:

    in_valid:
      notes: "Input valid strobe (driven from pixel_normalizer's normalized_valid)"

    win_r0c0:
      notes: "Window tap (x-1, y-1), zero-padded at frame/row borders"

    win_r0c1:
      notes: "Window tap (x, y-1), zero-padded at the top border"

    win_r0c2:
      notes: "Window tap (x+1, y-1), zero-padded at frame/row borders"

    win_r1c0:
      notes: "Window tap (x-1, y), zero-padded at the left border"

    win_r1c1:
      notes: "Window tap (x, y) -- the center pixel itself"

    win_r1c2:
      notes: "Window tap (x+1, y), zero-padded at the right border"

    win_r2c0:
      notes: "Window tap (x-1, y+1), zero-padded at frame/row borders"

    win_r2c1:
      notes: "Window tap (x, y+1), zero-padded at the bottom border (last row)"

    win_r2c2:
      notes: "Window tap (x+1, y+1), zero-padded at frame/row borders"

    out_x:
      notes: "x of the window's center pixel"

    out_y:
      notes: "y of the window's center pixel"

    out_frame_id:

    out_tile_id:

    out_end_of_line:

    out_end_of_frame:

    out_valid:
      notes: "Output valid strobe"
