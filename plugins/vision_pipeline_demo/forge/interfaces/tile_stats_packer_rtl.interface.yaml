# Integration contract for the tile_stats_packer_rtl module
#
# IP: tile_stats_packer_rtl
# ip_info_key: tspack
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: tile_stats_packer_rtl
  ip_info_key: tspack
  source_type: rtl
  normalization_status: ready
  notes: >
    Packs tile_summary_join_rtl's tile-statistics fields into the
    128-bit tile-statistics packet record plus a 1-bit CDC-novelty
    toggle (129 bits total) -- source of the pixel -> output
    cdc: {kind: async_fifo} connection to packetizer_rtl. Literal
    ap_clk/ap_rst -- pixel is this design's primary domain (see
    design_packetizer.yml). Fixed latency 1 cycle, II=1.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    in_tile_id:

    in_minimum:

    in_maximum:

    in_mean:

    in_variance:

    in_frame_id:

    in_valid:

    out_record:
      notes: "{toggle, record[127:0]} -- cdc: {kind: async_fifo} source -> output"

    out_record_valid:
      notes: "Real per-record write-enable -- cdc.write_enable_pin for the async_fifo crossing above"
