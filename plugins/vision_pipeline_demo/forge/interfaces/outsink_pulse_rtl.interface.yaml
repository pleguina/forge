# Integration contract for the outsink_pulse_rtl module
#
# IP: outsink_pulse_rtl
# ip_info_key: outpls
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: outsink_pulse_rtl
  ip_info_key: outpls
  source_type: rtl
  normalization_status: ready
  notes: >
    Slice 10.4 (release-plan Phase 10, preflight.md §5 Decision A): the
    `output` domain's pulse_sync source. Genuinely non-standard
    clock_primary/reset_primary names (clk_output/rst_output) -- see
    outsink_pulse_rtl.v.

  roles:

    clock_primary:
      raw_port: clk_output
      direction: input
      width: 1

    reset_primary:
      raw_port: rst_output
      direction: input
      width: 1
      active_level: high

    frame_done_pulse_in:
      raw_port: frame_done_pulse_in
      direction: input
      width: 1
      notes: "Testbench-driven pulse"

    frame_done_out:
      raw_port: frame_done_out
      direction: output
      width: 1
      notes: "cdc: {kind: pulse_sync} source -> control"
