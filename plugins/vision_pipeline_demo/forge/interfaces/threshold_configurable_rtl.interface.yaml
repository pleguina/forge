# Integration contract for the threshold_configurable_rtl module
#
# IP: threshold_configurable_rtl
# ip_info_key: threshcfg
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: threshold_configurable_rtl
  ip_info_key: threshcfg
  source_type: rtl
  normalization_status: ready
  notes: >
    This is a runtime-configurable variant of threshold_rtl.v --
    threshold comes from the control domain's real
    cdc: {kind: mailbox_transfer} crossing (ctrl_mailbox_rtl.v's
    bundle), latched at frame boundaries so a mid-frame configuration
    update never changes the threshold applied to pixels already in
    flight. Fixed 2-cycle registered latency, same as threshold_rtl.v.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    normalized_pixel:

    x:

    y:

    frame_id:

    tile_id:

    end_of_line:

    end_of_frame:

    in_valid:
      notes: "Input valid strobe (driven from pixel_normalizer's normalized_valid)"

    mailbox_in:
      notes: "Already synchronized -- destination of the control -> pixel cdc: {kind: mailbox_transfer} connection"

    out_pixel:
      notes: "normalized_pixel, passed through"

    threshold_mask:
      notes: "(normalized_pixel >= active_threshold), active_threshold latched at frame boundaries"

    out_x:

    out_y:

    out_frame_id:

    out_tile_id:

    out_end_of_line:

    out_end_of_frame:

    out_valid:
      notes: "Output valid strobe"
