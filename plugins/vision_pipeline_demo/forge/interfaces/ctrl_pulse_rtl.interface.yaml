# Integration contract for the ctrl_pulse_rtl module
#
# IP: ctrl_pulse_rtl
# ip_info_key: ctrlpls
# Policy: docs/concepts/contracts-and-protocols.md

ip_interface:
  module_name: ctrl_pulse_rtl
  ip_info_key: ctrlpls
  source_type: rtl
  normalization_status: ready
  notes: >
    This is the `control` domain's pulse_sync endpoint pair. Literal ap_clk/ap_rst
    (control is this design's primary domain) -- see ctrl_pulse_rtl.v
    for why this is a dedicated module.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    apply_in:
      notes: "Pulse"

    frame_done_in:
      notes: "Already synchronized pulse -- destination of the output -> control cdc: {kind: pulse_sync} connection"

    pulse_out:
      notes: "cdc: {kind: pulse_sync} source -> pixel"

    frame_done_count:
