# ═══════════════════════════════════════════════════════════════════════
# Vision Pipeline Demo — Verification Design Contract (quickstart tier)
# ═══════════════════════════════════════════════════════════════════════
#
#   forge topgen gen-top   plugins/vision_pipeline_demo/forge/designs/design.yml --mode verilog ...
#   forge verify generate  plugins/vision_pipeline_demo/forge/verify/design.verification.yml
#   forge verify doctor    plugins/vision_pipeline_demo/forge/verify/design.verification.yml
#   forge verify run       plugins/vision_pipeline_demo/forge/verify/quickstart_pipeline_xsim/verify.flow.yml --plugin vision_pipeline_demo
#
# Two flows, deliberately not three: a standalone `single_module_rtl` flow
# for pixel_normalizer was scoped out for this slice — its generated
# testbench would drive the raw Vitis-synthesized RTL's port names
# directly (via a hand-authored stimulus_current.svh), which isn't known
# until real HLS synthesis has actually run once; the full_chip_rtl flow
# below exercises the same module through FORGE's own generator, which
# handles that raw-port translation via the interface contract instead of
# a hand-driven TB guessing it. See docs/internal/phase10/preflight.md /
# the quickstart tutorial for the full reasoning.
# ───────────────────────────────────────────────────────────────────────
schema_version: "1.0"
plugin: vision_pipeline_demo

# ─── Datasets ─────────────────────────────────────────────────────────
datasets:
  vision_pipeline_quickstart_golden:
    xml: schemas/data/vision_pipeline_quickstart_golden.xml
    description: >
      8x8 synthetic ramp frame (64 events). Carries only <in> values —
      expected outputs are computed live by a real GoldenModelProvider
      (release-plan Phase 10, slice 10.0A/10.1 Decision C), not
      hand-typed and never cross-checked.
    adapter: vision_pipeline.pixel-stream-xml

  # Slice 10.7A (release-plan Phase 10, preflight.md §10's frozen
  # full-functional acceptance size): a real 16x16 checkerboard frame
  # (256 events, generated via the slice 10.6 DatasetService/
  # SyntheticPatternAdapter path — `datasets/cli.py generate-synthetic
  # --width 16 --height 16 --pattern checkerboard --seed 42`), the
  # smallest frame that forces a real 2x2 tile grid (4 tiles) and
  # therefore genuinely exercises tile_stats_hls's slice-10.7A
  # concurrent-tile-column extension, not just single-tile correctness.
  vision_pipeline_full_functional_golden:
    xml: schemas/data/vision_pipeline_full_functional_golden.xml
    description: >
      16x16 synthetic checkerboard frame (256 events, 2x2 tile grid).
      Carries only <in> values — expected outputs computed live by
      PacketizerProvider (release-plan Phase 10, slice 10.0A Decision C),
      generalized in slice 10.7A to multiple tiles per dataset.
    adapter: vision_pipeline.pixel-stream-xml

# ─── Simulation Defaults ──────────────────────────────────────────────
defaults:
  clk_period_ns:              4.0
  reset_cycles:               4
  idle_cycles_after_reset:    0
  post_stimulus_drain_cycles: 6   # 3 HLS LATENCY + 2 RTL threshold latency + 1 margin

# ─── Flows ────────────────────────────────────────────────────────────
flows:

  - name:             pixel_normalizer_csim
    kind:             hls_csim
    backend:          csim
    top_module:       pixel_normalizer
    tb_module:        tb_pixel_normalizer
    dut_rtl_source:   build_hls_vision_pipeline_demo/pixel_normalizer/solution1/syn/verilog
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    coverage_intent:  functional

  - name:             quickstart_pipeline_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_quickstart
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 6
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Slice 10.2 (release-plan Phase 10, preflight.md §6.2): pixel-result
  # path -- window_builder_rtl -> sobel_hls -> edge_mask_merge_rtl,
  # merged against the delayed threshold branch. Streams the full 8x8
  # frame (64 pixels) through in one run instead of one isolated pixel
  # per invocation -- see gen_stimulus_pixel_result.py for the schedule.
  - name:             pixel_result_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_pixel_result
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 4
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Slice 10.3 (release-plan Phase 10, preflight.md §6.2): tile-statistics
  # path -- tile_stats_hls (bounded->fixed, see modules.yml) +
  # tile_boundary_rtl -> tile_summary_join_rtl. Pixels are driven 2
  # iterations apart (tile_stats_hls is genuinely II=2) -- see
  # gen_stimulus_tile_stats.py.
  - name:             tile_stats_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_tile_stats
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 12
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Slice 10.5 (release-plan Phase 10, preflight.md §6.1/§6.2/§9.1, §5
  # Decision B): packetizer path -- two independent record-producing
  # paths (pixel-result: window_builder_rtl/sobel_hls/threshold_rtl/
  # edge_mask_merge_rtl/pixel_result_packer_rtl; tile-statistics:
  # tile_stats_hls/tile_boundary_rtl/tile_summary_join_rtl/
  # tile_stats_packer_rtl), each crossing pixel -> output via its own
  # real cdc: {kind: async_fifo, depth: 64}, multiplexed onto the
  # corrected 256-bit forge.packet_stream.v1 by packetizer_rtl (output
  # domain). `pixel` is this design's primary domain (ap_clk, genuinely
  # 200MHz/5ns per spec §6, unlike 10.2/10.3's informal 4.0ns testing
  # clock) -- extra_clocks below is only the real secondary `output`
  # domain (125MHz/8ns). See gen_stimulus_packetizer.py for the
  # fork/join dual-clock-domain drive+check strategy.
  - name:             packetizer_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_packetizer
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0    # pixel domain (ap_clk): 200MHz, matching design_packetizer.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 20
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Slice 10.5 negative fixture (spec §17.5 "Invalid FIFO fixture"):
  # identical to packetizer_xsim except the pixel-result crossing's real
  # async_fifo depth is 4 instead of 64 -- see
  # invalid_fifo_depth_packetizer.yml's own header. Real data loss is
  # expected here (that's the point) -- checker_mode stays log_scan like
  # every other flow, so this flow's own scoreboard "FAIL" is itself
  # part of the fixture's evidence, not a broken flow.
  - name:             invalid_fifo_depth_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_invalid_fifo_depth
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 20
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Slice 10.4 (release-plan Phase 10, preflight.md §5 Decision A):
  # multi-domain CDC path -- ctrl_level_rtl/ctrl_pulse_rtl/ctrl_mailbox_rtl
  # (control, ap_clk) -> pixel_sink_rtl (pixel, clk_pixel) -> outsink_level_rtl
  # (output, clk_output) -> back to control. extra_clocks is this slice's
  # own new framework capability (forge.verify.gen_sim) -- clk_pixel/
  # clk_output are genuinely 200MHz/125MHz, independent of and faster than
  # control's 50MHz ap_clk. No extra_resets: rst_pixel/rst_output are real
  # reset_domains.*.sync: reset_sync destinations (design_cdc.yml) --
  # internally synchronized from ap_rst by a real cdc_reset_sync instance,
  # not driven by the testbench directly (their own top-level ports are
  # unused/dangling by design -- see design_cdc.yml's header). Dataset
  # reference is a required-schema formality, not a real dependency: this
  # flow's gen_stimulus_cdc.py drives fixed constants directly, not a
  # per-event dataset (see that script's own header for why).
  # Slice 10.7A (release-plan Phase 10, preflight.md §11's 10.7A
  # sub-slice): the real full-functional design -- a single shared
  # `norm` (pixel_normalizer) fanning out to all four downstream
  # consumers (unifying design_packetizer.yml's own norm_px/norm_tile
  # split), streaming a real 16x16/2x2-tile frame (256 pixel-result
  # records + 4 tile-statistics records) through the same packetizer/
  # async-FIFO/throughput path slice 10.5 built. See
  # gen_stimulus_full_functional.py for the dual-clock-domain drive+check
  # strategy (same fork/join precedent as packetizer_xsim).
  - name:             full_functional_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_full_functional
    dataset:          vision_pipeline_full_functional_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0    # pixel domain (ap_clk): 200MHz, matching design_full_functional.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 40
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  - name:             cdc_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_cdc
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              20.0   # control domain (ap_clk): 50MHz, matching design_cdc.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 8
      extra_clocks:
        clk_pixel:  5.0
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration
