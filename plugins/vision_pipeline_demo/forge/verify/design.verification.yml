# ═══════════════════════════════════════════════════════════════════════
# Vision Pipeline Demo — Verification Design Contract
# ═══════════════════════════════════════════════════════════════════════
#
#   forge topgen gen-top   plugins/vision_pipeline_demo/forge/designs/design.yml --mode verilog ...
#   forge verify generate  plugins/vision_pipeline_demo/forge/verify/design.verification.yml
#   forge verify doctor    plugins/vision_pipeline_demo/forge/verify/design.verification.yml
#   forge verify run       plugins/vision_pipeline_demo/forge/verify/quickstart_pipeline_xsim/verify.flow.yml --plugin vision_pipeline_demo
#
# pixel_normalizer is never verified through a standalone `single_module_rtl`
# flow: that flow kind's generated testbench drives the raw
# Vitis-synthesized RTL's port names directly (via a hand-authored
# stimulus_current.svh), which isn't known until real HLS synthesis has
# actually run once. The full_chip_rtl flows below exercise the same
# module through FORGE's own generator instead, which handles that
# raw-port translation via the interface contract rather than a
# hand-driven TB guessing it — see the quickstart tutorial for the full
# reasoning.
# ───────────────────────────────────────────────────────────────────────
schema_version: "1.0"
plugin: vision_pipeline_demo

# ─── Datasets ─────────────────────────────────────────────────────────
datasets:
  vision_pipeline_quickstart_golden:
    xml: schemas/data/vision_pipeline_quickstart_golden.xml
    description: >
      8x8 synthetic ramp frame (64 events). Carries only <in> values —
      expected outputs are computed live by a real GoldenModelProvider,
      not hand-typed and never cross-checked (see
      docs/development/adr/0004-golden-model-provider-boundary.md).
    adapter: vision_pipeline.pixel-stream-xml

  # A real 16x16 checkerboard frame (256 events, generated via the
  # DatasetService/SyntheticPatternAdapter path — `datasets/cli.py
  # generate-synthetic --width 16 --height 16 --pattern checkerboard
  # --seed 42`), the smallest frame that forces a real 2x2 tile grid
  # (4 tiles) and therefore genuinely exercises tile_stats_hls's
  # concurrent-tile-column extension, not just single-tile correctness.
  vision_pipeline_full_functional_golden:
    xml: schemas/data/vision_pipeline_full_functional_golden.xml
    description: >
      16x16 synthetic checkerboard frame (256 events, 2x2 tile grid).
      Carries only <in> values — expected outputs computed live by
      PacketizerProvider, which supports multiple tiles per dataset.
    adapter: vision_pipeline.pixel-stream-xml

  # Two real 8x8 quickstart-scale frames back to back (frame_id 0 =
  # ramp, frame_id 1 = checkerboard, 128 events — `datasets/cli.py
  # generate-synthetic --width 8 --height 8 --pattern ramp --pattern
  # checkerboard --event-count 2 --seed 7`), proving a real
  # mailbox-written threshold change between frames actually changes
  # pipeline behavior at the next frame boundary, not just "compiles" —
  # PlatformWrapperProvider computes each frame's own expected
  # threshold_mask from a real per-frame threshold schedule.
  vision_pipeline_platform_wrapper_golden:
    xml: schemas/data/vision_pipeline_platform_wrapper_golden.xml
    description: >
      Two 8x8 synthetic frames back to back (128 events, frame_id
      0=ramp/1=checkerboard). Carries only <in> values — expected
      outputs computed live by PlatformWrapperProvider, with a real
      per-frame threshold schedule.
    adapter: vision_pipeline.pixel-stream-xml

# ─── Simulation Defaults ──────────────────────────────────────────────
defaults:
  clk_period_ns:              4.0
  reset_cycles:               4
  idle_cycles_after_reset:    0
  post_stimulus_drain_cycles: 6   # 3 HLS LATENCY + 2 RTL threshold latency + 1 margin

# ─── Flows ────────────────────────────────────────────────────────────
flows:

  - name:             pixel_normalizer_csim
    kind:             hls_csim
    backend:          csim
    top_module:       pixel_normalizer
    tb_module:        tb_pixel_normalizer
    dut_rtl_source:   build_hls_vision_pipeline_demo/pixel_normalizer/solution1/syn/verilog
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    coverage_intent:  functional

  - name:             quickstart_pipeline_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_quickstart
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 6
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Pixel-result path -- window_builder_rtl -> sobel_hls ->
  # edge_mask_merge_rtl, merged against the delayed threshold branch.
  # Streams the full 8x8 frame (64 pixels) through in one run instead of
  # one isolated pixel per invocation -- see gen_stimulus_pixel_result.py
  # for the schedule.
  - name:             pixel_result_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_pixel_result
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 4
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Tile-statistics path -- tile_stats_hls (fixed latency, see
  # modules.yml) + tile_boundary_rtl -> tile_summary_join_rtl. Pixels are
  # driven back to back, one iteration apart (tile_stats_hls is real
  # II=1) -- see gen_stimulus_tile_stats.py.
  - name:             tile_stats_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_tile_stats
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 12
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Packetizer path -- two independent record-producing paths
  # (pixel-result: window_builder_rtl/sobel_hls/threshold_rtl/
  # edge_mask_merge_rtl/pixel_result_packer_rtl; tile-statistics:
  # tile_stats_hls/tile_boundary_rtl/tile_summary_join_rtl/
  # tile_stats_packer_rtl), each crossing pixel -> output via its own
  # real cdc: {kind: async_fifo, depth: 64}, multiplexed onto
  # forge.packet_stream.v1 (256-bit beat, see
  # docs/development/adr/0003-vision-packet-format.md) by
  # packetizer_rtl (output domain). `pixel` is this design's primary
  # domain (ap_clk, genuinely 200MHz/5ns, a real rate this design cares
  # about for throughput reporting, unlike some earlier designs' informal
  # 4.0ns testing clock) -- extra_clocks below is only the real secondary
  # `output` domain (125MHz/8ns). See gen_stimulus_packetizer.py for the
  # fork/join dual-clock-domain drive+check strategy.
  - name:             packetizer_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_packetizer
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0    # pixel domain (ap_clk): 200MHz, matching design_packetizer.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 20
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Negative fixture: identical to packetizer_xsim except the
  # pixel-result crossing's real async_fifo depth is 4 instead of 64 --
  # see
  # invalid_fifo_depth_packetizer.yml's own header. Real data loss is
  # expected here (that's the point) -- checker_mode stays log_scan like
  # every other flow, so this flow's own scoreboard "FAIL" is itself
  # part of the fixture's evidence, not a broken flow.
  - name:             invalid_fifo_depth_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_invalid_fifo_depth
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 20
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Full-functional path -- a single shared `norm` (pixel_normalizer)
  # fanning out to all four downstream consumers (rather than the
  # independent norm_px/norm_tile instances packetizer_xsim above uses),
  # streaming a real 16x16/2x2-tile frame (256 pixel-result records + 4
  # tile-statistics records) through the same packetizer/async-FIFO/
  # throughput path packetizer_xsim exercises. See
  # gen_stimulus_full_functional.py for the dual-clock-domain drive+check
  # strategy (same fork/join pattern as packetizer_xsim).
  - name:             full_functional_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_full_functional
    dataset:          vision_pipeline_full_functional_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0    # pixel domain (ap_clk): 200MHz, matching design_full_functional.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 40
      extra_clocks:
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # A real 3-domain assembly -- control (clk_control, 50MHz,
  # ctrl_mailbox_platform_rtl) -> pixel (ap_clk, 200MHz, the real
  # 9-module pipeline reused unmodified from the earlier per-path designs
  # plus the new threshcfg) -> output (clk_output, 125MHz, pktz), plus a
  # real status interface (merge.tag_mismatch/
  # tjoin.join_mismatch/tjoin.out_end_of_frame). `ap_clk` (pixel) is
  # this design's primary domain, unlike design_cdc.yml's own control-
  # primary convention -- see design_platform_wrapper.yml's own header
  # for why. See gen_stimulus_platform_wrapper.py for the
  # three-clock-domain fork/join drive+check strategy, proving a real
  # mailbox-written threshold change actually changes pipeline behavior
  # at the next frame boundary.
  - name:             platform_wrapper_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_platform_wrapper
    dataset:          vision_pipeline_platform_wrapper_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              5.0    # pixel domain (ap_clk): 200MHz, matching design_platform_wrapper.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 40
      extra_clocks:
        clk_control: 20.0
        clk_output:  8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration

  # Multi-domain CDC path -- ctrl_level_rtl/ctrl_pulse_rtl/ctrl_mailbox_rtl
  # (control, ap_clk) -> pixel_sink_rtl (pixel, clk_pixel) -> outsink_level_rtl
  # (output, clk_output) -> back to control. clk_pixel/clk_output are
  # genuinely 200MHz/125MHz, independent of and faster than control's
  # 50MHz ap_clk. No extra_resets: rst_pixel/rst_output are real
  # reset_domains.*.sync: reset_sync destinations (design_cdc.yml) --
  # internally synchronized from ap_rst by a real cdc_reset_sync instance,
  # not driven by the testbench directly (their own top-level ports are
  # unused/dangling by design -- see design_cdc.yml's header and
  # docs/development/adr/0002-cdc-primitive-semantics.md). Dataset
  # reference is a required-schema formality, not a real dependency: this
  # flow's gen_stimulus_cdc.py drives fixed constants directly, not a
  # per-event dataset (see that script's own header for why).
  - name:             cdc_xsim
    kind:             full_chip_rtl
    backend:          xsim
    top_module:       algo_top
    tb_module:        tb_algo_top
    dut_rtl_source:   gen-top/design_vision_pipeline_cdc
    dataset:          vision_pipeline_quickstart_golden
    default_event_id: 0
    simulation:
      clk_period_ns:              20.0   # control domain (ap_clk): 50MHz, matching design_cdc.yml
      reset_cycles:               4
      idle_cycles_after_reset:    0
      post_stimulus_drain_cycles: 8
      extra_clocks:
        clk_pixel:  5.0
        clk_output: 8.0
    xsim:
      top_lib: xil_defaultlib
      use_sv_flag: false
    coverage_intent:  integration
