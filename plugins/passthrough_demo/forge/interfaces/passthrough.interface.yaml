# Integration contract for the passthrough RTL reference module.

ip_interface:
  module_name: passthrough
  ip_info_key: pt
  source_type: rtl
  normalization_status: ready
  notes: >
    Minimal single-module reference. Registers a WIDTH-bit data path one
    clock cycle. Used to prove the FORGE pipeline end to end with no
    algorithm-specific vocabulary.

  roles:

    clock_primary:
      raw_port: ap_clk

    reset_primary:
      raw_port: ap_rst

    data_in:
      notes: "External stimulus input."

    data_in_valid:

    data_out:
      notes: "External readout output."

    data_out_valid:
