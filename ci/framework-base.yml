# ============================================================================
# ci/framework-base.yml
#
# Shared foundation for all arc-framework pipeline jobs.
# Provides:
#   - canonical stage order
#   - default image and runner tag
#   - pip cache policy
#   - reusable before_script anchor (.arc_python_setup)
#
# Consumed by: arc-framework/.gitlab-ci.yml
# Exposed to plugins via: ci/plugin-consumer.yml
# ============================================================================

stages:
  - lint
  - validate
  - test
  - smoke
  - release

default:
  image: python:3.11-slim
  tags:
    - docker
  interruptible: true

# ---------------------------------------------------------------------------
# Pip cache — keyed on the lockfile so cache is invalidated on dependency
# changes without manual intervention.
# ---------------------------------------------------------------------------
.arc_cache: &arc_cache
  cache:
    key:
      files:
        - framework/verify/python/pyproject.toml
        - framework/topgen/pyproject.toml
    paths:
      - .pip-cache/
    policy: pull-push

# ---------------------------------------------------------------------------
# .arc_python_setup
#
# Reference with:
#   before_script:
#     - !reference [.arc_python_setup, before_script]
#
# Installs both framework Python packages (topgen + fw_verify) from source
# into the CI container. Does NOT require setup_env.sh or a venv — the
# container already provides an isolated Python environment.
# ---------------------------------------------------------------------------
.arc_python_setup:
  before_script:
    - pip install --quiet --cache-dir .pip-cache
        -e framework/topgen
        -e "framework/verify/python[parser]"
        pytest pyyaml yamllint flake8
