# ============================================================================
# ci/framework-base.yml
#
# Shared foundation for all arc-framework pipeline jobs.
# Provides:
#   - canonical stage order
#   - default image and runner tag
#   - pip cache policy
#   - reusable before_script anchor (.forge_python_setup)
#
# Consumed by: forge-./.gitlab-ci.yml
# Exposed to plugins via: ci/plugin-consumer.yml
# ============================================================================

stages:
  - lint
  - validate
  - test
  - smoke
  - release

default:
  image: python:3.11-slim
  tags:
    - default-x86_64
  interruptible: true

# ---------------------------------------------------------------------------
# Pip cache — keyed on the lockfile so cache is invalidated on dependency
# changes without manual intervention.
# ---------------------------------------------------------------------------
.forge_cache: &forge_cache
  cache:
    key:
      files:
        - forge/pyproject.toml
    paths:
      - .pip-cache/
    policy: pull-push

# ---------------------------------------------------------------------------
# .forge_python_setup
#
# Reference with:
#   before_script:
#     - !reference [.forge_python_setup, before_script]
#
# Installs the forge package (topgen + hls + verify subpackages) from source
# into the CI container.
# ---------------------------------------------------------------------------
.forge_python_setup:
  before_script:
    - pip install --quiet --cache-dir .pip-cache
        -e forge
        pytest pytest-cov pyyaml yamllint flake8
