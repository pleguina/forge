[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "2.0.0"
description = "FORGE framework CLI — topology generation and verification orchestration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FORGE Framework Team"}
]
keywords = ["hdl", "vhdl", "fpga", "ip", "vivado", "top-level", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
# Note: VHDL linting uses GHDL (system package)
# Install with: apt-get install ghdl (Ubuntu/Debian)
#              dnf install ghdl (Fedora/RHEL)
#              brew install ghdl (macOS)
# Note: Verilog linting uses Verilator (system package only; RTL simulation is XSIM-first)
# Install with: apt-get install verilator (Ubuntu/Debian)
#              dnf install verilator (Fedora/RHEL)
#              brew install verilator (macOS)
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "types-PyYAML",
    "tomli>=2.0; python_version<'3.11'",
]
parser = [
    "pyverilog>=1.3.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.7,<10.0",
    "mike>=2.2,<3.0",
    # Needed by plugins/vision_pipeline_demo/tutorial/generate_reference_assets.py
    # (and its image_panels.py renderer) to build the tutorial's figure assets.
    "Pillow>=10.0",
]
all = [
    "forge[dev,parser,docs]",
]

[project.urls]
Homepage = "https://github.com/pleguina/forge"
Documentation = "https://github.com/pleguina/forge/blob/main/forge/README.md"
Repository = "https://github.com/pleguina/forge"
Issues = "https://github.com/pleguina/forge/issues"

[project.scripts]
forge = "forge.core.cli.main:main"

[tool.setuptools]
package-dir = {"forge" = "."}
packages = [
    "forge",
    "forge.core", "forge.core.cli", "forge.core.cli.groups", "forge.core.utils",
    "forge.docsgen",
    "forge.integration",
    "forge.ir",
    "forge.contracts",
    "forge.generation", "forge.generation.generators",
    "forge.hls",
    "forge.project",
    "forge.verification",
    "forge.analysis",
    "forge.analysis.hls_reports",
    "forge.analysis.latency_static",
    "forge.analysis.latency_runtime",
    "forge.analysis.throughput_static",
    "forge.analysis.throughput_runtime",
    "forge.analysis.result_plots",
    "forge.analysis.dashboards",
    "forge.analysis.design_explorer",
]

[tool.setuptools.package-data]
forge = [
    "py.typed", "contracts/*.yaml", "hls/templates/*.tcl.j2",
    "analysis/design_explorer/vendor/*",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=forge --cov-report=html --cov-report=term --cov-fail-under=49"
markers = [
    "integration: full-chain integration tests using real local repos (deselect with -m 'not integration')",
]
